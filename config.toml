# BITinvest — настройки исполнителя (slave-хост).
#
# Секретов здесь нет и быть не должно: токены живут в secrets/, см. README.
# Путь к этому файлу переопределяется переменной BITINVEST_CONFIG.

# mirror     — симметричное зеркало: догоняем целевые веса и покупками, и продажами.
# accumulate — дивидендный режим: имеющуюся позицию не наращиваем просто из-за
#              роста веса, новую покупаем целиком, продаём только когда мастер
#              реально сократился (см. [accumulate]).
# A/B (tools/ab_mode_policy.py, синтетика + реальные цены, см. wiki): accumulate
# впереди по equity и в 4-7 раз дешевле по числу сделок/комиссий в обоих случаях.
mode = "accumulate"

# Целевое суммарное плечо slave-счёта: gross exposure / equity.
# 1.0 = сумма модулей позиций равна собственным средствам, заёмных денег нет.
target_leverage = 1.0

# cap       — только понижаем: k = min(1, target / L_master). Если мастер сидит
#             в кэше (L < target), его кэш уважается, доинвестировать не лезем.
# normalize — всегда ровно target: k = target / L_master, в том числе вверх.
# A/B (tools/ab_leverage_policy.py, синтетика + реальные цены, см. wiki):
# normalize впереди по equity и дешевле по сделкам — cap зеркалит каждое мелкое
# дневное колебание собственной экспозиции мастера как реальную сделку.
leverage_policy = "normalize"

# Воспроизводить ли шорты мастера. При false отрицательные веса просто
# отбрасываются, лонги при этом НЕ перенормируются вверх — освободившаяся доля
# уходит в кэш.
allow_short = true

# Держать проектируемую начальную маржу не выше этой доли ликвидного портфеля.
# 1.0 = впритык к запрету на открытие новых позиций, 0.9 = с запасом.
# A/B (tools/ab_margin_safety.py, реальные просадки, см. wiki): здесь нет
# "правильного" значения — чистый trade-off между использованием капитала и
# частотой margin call (0.7 -> ~0.3% margin call, 1.0 -> ~4%). 0.9 — выбор
# риск-аппетита, не результат оптимизации.
margin_safety = 0.9

# Ордера дешевле этого (в рублях) не выставляем — пыль не стоит комиссии.
# A/B (tools/ab_accumulate_tuning.py): equity почти не меняется во всём
# диапазоне 0-8000₽, только число сделок. Оставлено на дефолте.
min_order_value = 1000.0

# Снимок мастера старше этого возраста (секунды) считается протухшим:
# исполнитель не торгует вообще. Защита от умершего parser-хоста.
max_step_age_sec = 900

# true — всё считается и логируется, но ни один ордер не уходит в сеть.
dry_run = false

# Как закрывать позицию, которой у мастера больше нет вообще:
#   gradual — не одним ордером, а по частям: за цикл продаём/закрываем
#             liquidation_step_pct от того, что сейчас держим (округление
#             вверх, но не меньше 1 лота — поэтому всегда доходит до нуля за
#             конечное число циклов). Это и есть исходное поведение v0.1
#             (там был жёстко зашит 1 лот/цикл без настройки) — осознанный
#             выбор не сливать позицию одним ордером, особенно в момент
#             перехода счёта на автоследование, когда на нём остаются старые
#             позиции, которых у мастера никогда не было.
#   full    — закрывать одним ордером сразу. Быстрее догоняет мастера, но
#             весь объём уходит в рынок за один раз.
# A/B (tools/ab_liquidation_policy.py, синтетика + реальные данные, см. wiki):
# gradual дешевле full почти везде (95-100% побед по бакетам ликвидности),
# кроме совсем ликвидных позиций (меньше дневного объёма), где выигрыш скромнее
# но всё равно на стороне gradual. Подтверждено, не меняем.
liquidation_mode = "gradual"

# Доля ТЕКУЩЕЙ позиции, закрываемая за один цикл при gradual (округление вверх,
# не меньше 1 лота). 25 -> позиция закрывается примерно за 4 цикла.
# A/B: из проверенных 10/25/40% — 25% дешевле по издержкам во всех бакетах
# ликвидности одновременно. Подтверждено, не меняем.
liquidation_step_pct = 25.0

[accumulate]
# Куда девать свободный кэш, когда состав мастера не менялся:
#   underweight_first — докладывать в позиции с наибольшим отставанием от цели
#   proportional      — раскладывать по всем целевым позициям пропорционально весам
#   never             — не трогать (буквальное поведение v0.1, деньги простаивают)
# A/B (tools/ab_cash_policy.py, синтетика + реальные данные, см. wiki): never
# заметно хуже обоих активных вариантов; underweight_first и proportional
# статистически неотличимы друг от друга — выбор между ними без разницы.
deploy_free_cash = "underweight_first"

# Доля equity, которую не пускаем в раскладку свободного кэша (см. выше).
# На покупку позиции, которую мастер только что открыл, не влияет — там мы
# повторяем аллокацию мастера, а не пристраиваем простаивающие деньги.
# A/B (tools/ab_accumulate_tuning.py): 0% чисто выигрывает у 5%/15% и на
# синтетике, и на реальных данных. Подтверждено, не меняем.
cash_buffer_pct = 0.0

# Продаём, только если позиция перевешивает цель более чем на столько процентов.
# Гасит дёрганье на дрейфе цен: выросшая бумага не режется автоматически.
# A/B (tools/ab_accumulate_tuning.py): из 10/25/50% равновесие equity внутри
# погрешности, число сделок падает с ростом порога. Оставлено на дефолте.
trim_threshold_pct = 25.0
