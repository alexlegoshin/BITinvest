# BITinvest — настройки исполнителя (slave-хост).
#
# Секретов здесь нет и быть не должно: токены живут в secrets/, см. README.
# Путь к этому файлу переопределяется переменной BITINVEST_CONFIG.

# mirror     — симметричное зеркало: догоняем целевые веса и покупками, и продажами.
# accumulate — дивидендный режим: имеющуюся позицию не наращиваем просто из-за
#              роста веса, новую покупаем целиком, продаём только когда мастер
#              реально сократился (см. [accumulate]).
mode = "mirror"

# Целевое суммарное плечо slave-счёта: gross exposure / equity.
# 1.0 = сумма модулей позиций равна собственным средствам, заёмных денег нет.
target_leverage = 1.0

# cap       — только понижаем: k = min(1, target / L_master). Если мастер сидит
#             в кэше (L < target), его кэш уважается, доинвестировать не лезем.
# normalize — всегда ровно target: k = target / L_master, в том числе вверх.
leverage_policy = "cap"

# Воспроизводить ли шорты мастера. При false отрицательные веса просто
# отбрасываются, лонги при этом НЕ перенормируются вверх — освободившаяся доля
# уходит в кэш.
allow_short = true

# Держать проектируемую начальную маржу не выше этой доли ликвидного портфеля.
# 1.0 = впритык к запрету на открытие новых позиций, 0.9 = с запасом.
margin_safety = 0.9

# Ордера дешевле этого (в рублях) не выставляем — пыль не стоит комиссии.
min_order_value = 1000.0

# Снимок мастера старше этого возраста (секунды) считается протухшим:
# исполнитель не торгует вообще. Защита от умершего parser-хоста.
max_step_age_sec = 900

# true — всё считается и логируется, но ни один ордер не уходит в сеть.
dry_run = false

[accumulate]
# Куда девать свободный кэш, когда состав мастера не менялся:
#   underweight_first — докладывать в позиции с наибольшим отставанием от цели
#   proportional      — раскладывать по всем целевым позициям пропорционально весам
#   never             — не трогать (буквальное поведение v0.1, деньги простаивают)
# Сравнение never против underweight_first: python tools/ab_cash_policy.py
deploy_free_cash = "underweight_first"

# Доля equity, которую не пускаем в раскладку свободного кэша (см. выше).
# На покупку позиции, которую мастер только что открыл, не влияет — там мы
# повторяем аллокацию мастера, а не пристраиваем простаивающие деньги.
cash_buffer_pct = 0.0

# Продаём, только если позиция перевешивает цель более чем на столько процентов.
# Гасит дёрганье на дрейфе цен: выросшая бумага не режется автоматически.
trim_threshold_pct = 25.0
